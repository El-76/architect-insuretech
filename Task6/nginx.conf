http {
    # Ограничение: в среднем 10 запросов в минуту для всех клиентов
    limit_req_zone "backend" zone=backend_limit:1m rate=10r/m;

    # Возвращать HTTP 429 при превышении лимита
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применить ограничение запросов
            limit_req zone=backend_limit;

            proxy_pass http://backend_servers;
        }
    }
}