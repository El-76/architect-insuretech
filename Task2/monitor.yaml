apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scaletestapp
  namespace: scaletestapp
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - scaletestapp

  selector:
    matchLabels:
      app: scaletestapp

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
